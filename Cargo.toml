[package]
name = "badassh"
version = "0.1.0"
edition = "2021"

[dependencies]
# TUI Framework
ratatui = "0.29"
crossterm = "0.28"

# SSH
ssh2 = "0.9"


# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
anyhow = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
zip = "2"
walkdir = "2"
parking_lot = "0.12"
log = "0.4"
simplelog = "0.12"
regex = "1"
notify = "6"

# Terminal emulation
portable-pty = "0.8"
vte = "0.13"
