name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  macos-binary:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust macOS targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build (Apple Silicon)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build (Intel)
        env:
          CC_x86_64_apple_darwin: "clang -arch x86_64"
          CXX_x86_64_apple_darwin: "clang++ -arch x86_64"
          CMAKE_OSX_ARCHITECTURES: x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Stage release binaries
        run: |
          mkdir -p release_assets
          cp target/aarch64-apple-darwin/release/badassh release_assets/badassh-macos-silicon
          cp target/x86_64-apple-darwin/release/badassh release_assets/badassh-macos-intel

      - name: Write release notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          PREV="$(git tag -l 'v*' --sort=-v:refname | grep -Fxv "$TAG" | head -n1 || true)"
          {
            if [ -n "$PREV" ]; then
              echo "Changes since **$PREV**:"
              echo ""
              git log --pretty=format:'- %s (%h)' "${PREV}..${TAG}"
            else
              echo "First **$TAG** release — full history:"
              echo ""
              git log --pretty=format:'- %s (%h)' "${TAG}"
            fi
          } > release_notes.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release_notes.md
          files: |
            release_assets/badassh-macos-intel
            release_assets/badassh-macos-silicon
